<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>抹茶日和</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3efe6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* 操作中にブラウザのスクロール/ズームを抑止 */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        outline: none;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #6b5e45;
        background: rgba(255, 255, 255, 0.6);
        padding: 6px 14px;
        border-radius: 999px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hint">茶碗の中をドラッグ / スライドして茶筅を動かせます</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
